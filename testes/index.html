<!-- Testes do C_FORMULÁRIO - Validador de formulários -->

<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teste c_formulario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../c_formulario/c_formulario.css">
    <script src="../c_formulario/c_aviso.js"></script>
    <script src="../c_formulario/c_formulario.js"></script>
</head>
<body class="p-4">
<div class="container" style="max-width: 640px">
    <h1 class="h4 mb-3">Teste c_formulario</h1>
    <form id="form1" novalidate>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome (obrigatório; experimente escrever <code>"</code>)</label>
            <input id="nome" name="nome" class="form-control">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email (aceita <code>.info</code>)</label>
            <input id="email" name="email" class="form-control" formulario-numobj="10">
        </div>
        <div class="mb-3">
            <label for="data" class="form-label">Data (hoje ou futura)</label>
            <input id="data" name="data" type="date" class="form-control">
        </div>
        <div class="mb-3">
            <label for="codigo" class="form-label">Código (4+ marcadores na mesma expressão: deve ter "a", "b", "c" e "d")</label>
            <input id="codigo" name="codigo" class="form-control">
        </div>
        <div class="mb-3">
            <label for="extra" class="form-label">Campo extra (obrigatório até ser desativado)</label>
            <input id="extra" name="extra" class="form-control">
            <button type="button" class="btn btn-sm btn-outline-secondary mt-1" id="desativa">Desativar campo extra</button>
        </div>
        <div class="mb-3">
            <span class="form-label d-block">Opções (escolha pelo menos 1)</span>
            <div id="opcoes" class="p-2">
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="opcoes" id="opcoes_a" value="a"><label class="form-check-label" for="opcoes_a">A</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="opcoes" id="opcoes_b" value="b"><label class="form-check-label" for="opcoes_b">B</label></div>
            </div>
        </div>
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="aceito" name="aceito">
                <label class="form-check-label" for="aceito">Aceito os termos</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submeter</button>
        <button type="button" class="btn btn-outline-secondary" id="limpar">Limpar (sem reset)</button>
    </form>

    <h2 class="h6 mt-4">Avisos (c_aviso)</h2>
    <div class="d-flex flex-wrap gap-2 mb-2">
        <button type="button" class="btn btn-sm btn-outline-success" onclick="c_aviso.sucesso('Os dados foram gravados.', 'Gravado')">Sucesso</button>
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="c_aviso.mostrar('danger', 'Resolva os erros', '', 4000, { codigo: 'C_F - E0' })">Erro</button>
        <button type="button" class="btn btn-sm btn-outline-warning" onclick="c_aviso.aviso('A sessão expira em 5 minutos.', 'Atenção')">Aviso</button>
        <button type="button" class="btn btn-sm btn-outline-info" onclick="c_aviso.informacao('Existe uma nova versão disponível.')">Informação</button>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="c_aviso.mostrar('primary', 'Este aviso só fecha no botão.', 'Fixo', 0)">Fixo</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.documentElement.dataset.bsTheme = document.documentElement.dataset.bsTheme === 'dark' ? 'light' : 'dark'">Modo claro/escuro</button>
    </div>

    <h2 class="h6 mt-4">Testes automáticos</h2>
    <button type="button" class="btn btn-sm btn-outline-primary mb-2" id="correr_testes">Correr testes</button>
    <ul id="resultados" class="small"></ul>
    <div id="resumo" class="small text-body-secondary"></div>
</div>
<script>
const f = new c_formulario("form1");
f.Adiciona_Validacoes(["nome", "«nome.val» == ''", "Indique o nome"]);
f.Adiciona_Validacoes([10, "«email.email» == false", "Email inválido"]);   // campo indicado pelo formulario-numobj="10" (o email)
f.Adiciona_Validacoes(["data", "«data.dh_MI» == false", "A data tem de ser hoje ou futura"]);
f.Adiciona_Validacoes(["codigo", "!«codigo.includes('a')» || !«codigo.includes('b')» || !«codigo.includes('c')» || !«codigo.includes('d')»", "Tem de conter a, b, c e d"]);
f.Adiciona_Validacoes(["extra", "«extra.len» == 0", "Campo extra obrigatório"]);
f.Adiciona_Validacoes(["opcoes?", "«opcoes?.len» == 0", "Escolha pelo menos uma opção"]);
f.Adiciona_Validacoes(["aceito", "«aceito.checked» == false", "Tem de aceitar os termos"]);

document.getElementById("form1").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!f.Testa_Validacoes()) c_aviso.sucesso("Formulário válido!", "OK");
});
// Validação ao vivo: ao sair de um campo ou ao alterá-lo, testa só as validações desse campo
document.querySelectorAll("#form1 input").forEach(el => {
    const alvo = el.name === "opcoes" ? "opcoes?" : el.id;
    el.addEventListener("blur", () => f.Testa_Validacoes(alvo, false));
    el.addEventListener("change", () => f.Testa_Validacoes(alvo, false));
});
document.getElementById("desativa").addEventListener("click", () => { document.getElementById("extra").disabled = true; });
document.getElementById("limpar").addEventListener("click", () => f.Limpar_Validacoes(false));
document.getElementById("correr_testes").addEventListener("click", correr_testes);

function correr_testes() {
    document.getElementById("resultados").innerHTML = "";
    const h = new Date();
    const hoje = `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, "0")}-${String(h.getDate()).padStart(2, "0")}`;
    const avaliar = (c) => c_formulario_avaliar(c, () => "912345678");

    define({ nome: "Ana", email: "ana@exemplo.info", data: hoje, codigo: "abcd", extra: "x", opcoes_a: true, aceito: true });
    testa("Formulário válido (data de hoje com dh_MI, email .info, 4 marcadores, grupo) → sem erros", f.Testa_Validacoes(undefined, false) === false);
    define({ nome: 'a" == 0 || "' });
    testa("Aspas no valor não contornam a validação (campo preenchido → sem erros)", f.Testa_Validacoes("nome", false) === false);
    define({ nome: "" });
    testa("Validação de um só campo deteta o erro", f.Testa_Validacoes("nome", false) === true);
    define({ nome: "Ana" });
    testa("Revalidar um campo com erro limpa o erro", f.Testa_Validacoes("nome", false) === false && !document.getElementById("nome").classList.contains("is-invalid"));
    define({ email: "x" });
    testa("Validação pelo número (formulario-numobj=10)", f.Testa_Validacoes(10, false) === true);
    define({ email: "ana@exemplo.info", data: "" });
    testa("Data vazia não rebenta a validação", f.Testa_Validacoes("data", false) === true);
    define({ data: hoje, extra: "" });
    document.getElementById("extra").disabled = true;
    testa("Campo desativado depois de criar o objeto é ignorado", f.Testa_Validacoes(undefined, false) === false);
    document.getElementById("extra").disabled = false;
    define({ extra: "x", opcoes_a: false });
    testa("Grupo sem opções marcadas dá erro e a mensagem aparece depois do grupo",
        f.Testa_Validacoes("opcoes?", false) === true && document.getElementById("erro_opcoes")?.textContent === "Escolha pelo menos uma opção");
    define({ opcoes_b: true });
    testa("Corrigir o grupo limpa o erro", f.Testa_Validacoes("opcoes?", false) === false);
    testa("Campo inexistente → devolve erro (não deixa submeter)", f.Testa_Validacoes("nao_existe", false) === true);
    define({ nome: "  Ana  " });
    f.Limpar_Validacoes(false);
    testa("Limpar_Validacoes(false) faz trim", document.getElementById("nome").value === "Ana");
    testa("Funções de texto e comparações ao estilo JavaScript", avaliar("«x.val».charAt(0) == '9' && «x.val» > 10 && '5' == 5 && !('5' === 5)") === true);
    let rejeitado = false;
    try { avaliar("alert(1)"); } catch (e) { rejeitado = true; }
    testa("Código fora das condições permitidas é rejeitado (sem eval)", rejeitado);
    testa("contar('texto') ignora maiúsculas", c_formulario_avaliar("«x.contar('HTTP')» == 3", () => 3) === true);
    f.Limpar_Validacoes(true);

    const total = document.querySelectorAll("#resultados li").length;
    const ok = document.querySelectorAll("#resultados li.text-success").length;
    document.getElementById("resumo").textContent = `${ok} de ${total} testes passaram`;
}

function testa(descricao, condicao) {
    const li = document.createElement("li");
    li.className = condicao ? "text-success" : "text-danger fw-bold";
    li.textContent = (condicao ? "✔ " : "✘ ") + descricao;
    document.getElementById("resultados").appendChild(li);
}

// Preenche os campos indicados em { id: valor }; nas checkboxes o valor (true/false) marca ou desmarca a caixa
function define(valores) {
    for (const id in valores) {
        const el = document.getElementById(id);
        if (el.type === "checkbox") el.checked = valores[id]; else el.value = valores[id];
    }
}

// testes/index.html?auto corre os testes ao abrir a página
if (location.search.includes("auto")) correr_testes();
</script>
</body>
</html>
